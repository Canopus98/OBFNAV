name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned image: ships with the Android SDK preinstalled (no setup-android step needed).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: OBF reader self-test (plain Java, no Android needed)
        run: |
          mkdir -p build/selftest
          javac -d build/selftest $(find app/src/main/java/dev/obfnav/core tools -name '*.java')
          java -cp build/selftest dev.obfnav.tools.SelfTest

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: obfnav-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
